name: device

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - name: Build the app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleAndroidDeviceTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disable-animations: true
          script: ./gradlew connectedCheck androidConnectedCheck
      - name: Fail unless the app's instrumented tests ran
        run: grep -lE 'tests="[1-9]' androidApp/build/outputs/androidTest-results/connected/debug/TEST-*.xml
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-api-${{ matrix.api-level }}
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
          if-no-files-found: warn
